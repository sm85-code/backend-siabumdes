name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt 'httpx>=0.27,<1'

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        # DATABASE_URL is intentionally unset: tests that need a real Postgres
        # instance skip themselves (see tests/test_postgresql_integration.py)
        # instead of failing, so this job stays fast and needs no DB service.
        # `python -m pytest` (not the bare `pytest` script) so the repo root
        # is added to sys.path -- otherwise `from modules...` / `from shared...`
        # imports fail since tests/ has no package __init__.py.
        run: python -m pytest tests/ -n 0

  integration-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siabumdes
          POSTGRES_PASSWORD: siabumdes
          POSTGRES_DB: siabumdes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siabumdes -d siabumdes_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt 'httpx>=0.27,<1'

      - name: Postgres integration tests
        env:
          DATABASE_URL: postgresql://siabumdes:siabumdes@localhost:5432/siabumdes_test
          # The postgres service container has no TLS; without this the
          # connection is attempted with ssl=True and the integration test
          # skips itself instead of running.
          POSTGRES_SSL: "false"
          RISKA_TEST_DATABASE_URL: postgresql+asyncpg://siabumdes:siabumdes@localhost:5432/siabumdes_test
        run: python -m pytest tests/test_postgresql_integration.py tests/test_b1_stock_atomicity.py tests/test_riska_execution_pg.py tests/test_riska_dialogue_pg.py tests/test_riska_crud_pg.py tests/test_riska_agent_pg.py tests/test_toko_transactions_pg.py tests/test_stock_out_internal_use.py tests/test_receipt_number_pg.py tests/test_bagi_hasil_transfer.py -n 0

  # Auto-deploy to the Oracle server (sm85-amd-temp) on push to main, only after all checks pass.
  # The deploy key is restricted server-side to /opt/deploy/dispatch.sh, which runs /opt/siabumdes/deploy.sh:
  # build image -> docker compose up -d (this service only) -> health check -> automatic rollback on failure.
  # Manual rollback on the server: sudo /opt/siabumdes/deploy.sh rollback
  deploy-oracle:
    needs: [lint-and-test, integration-pg]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: oracle-deploy-siabumdes
      cancel-in-progress: false
    steps:
      - name: Deploy to Oracle server
        env:
          KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 ubuntu@"$HOST" "deploy siabumdes ${{ github.sha }}"
